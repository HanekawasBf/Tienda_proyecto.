<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="card shadow login-card">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Iniciar sesión</h3>
            <div id="login-alerta" class="alert alert-danger d-none" role="alert"></div>

            <form id="form-login">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                <p class="text-muted text-center mt-3 mb-0"><small>Demo: admin / 1234</small></p>
            </form>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
